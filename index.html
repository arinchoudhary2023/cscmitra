<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1c2333;--mut:#667085;--pri:#1674e8;--bd:#e2e5ee;--ok:#2b8a3e;--bad:#c92a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

:root[data-theme="dark"]{color-scheme:dark;--bg:#12151c;--card:#1b2030;--tx:#e8eaf2;--mut:#9aa3b8;--bd:#2c3347;--pri:#5da0ff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;font:15px/1.45 system-ui,'Noto Sans Devanagari',sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
nav button{white-space:nowrap;background:none;color:var(--tx);border:1px solid var(--bd)}nav .on{background:var(--pri);color:#fff;border-color:var(--pri)}
main,.auth{max-width:900px;margin:0 auto;padding:14px}
button{background:var(--pri);color:#fff;border:0;border-radius:8px;padding:8px 12px;font:inherit;cursor:pointer}button.g{background:none;color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--bad)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit}
label{display:block;margin:8px 0;font-size:13px;color:var(--mut)}label.c{display:inline-block;margin:3px 8px 3px 0}label.c input{width:auto}
.card,.st{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.st{margin:0}.st b{display:block;font-size:20px}
.m{color:var(--mut);font-size:13px}.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.b{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--bd)}
.chip{background:none;color:var(--mut);border:1px solid var(--bd);margin:2px;padding:4px 8px;font-size:12px}.chip.on{background:var(--ok);color:#fff;border-color:var(--ok)}
.warn{background:#fff3bf;color:#5c4400;padding:8px;border-radius:8px;margin-bottom:8px}
.tabs{display:flex;gap:6px;margin:10px 0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ok);color:#fff;padding:10px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}.toast.show{opacity:1;transform:translate(-50%,0)}.toast.bad{background:var(--bad)}
.flash{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;background:var(--bg);color:var(--ok);opacity:0;pointer-events:none;transition:.3s;z-index:8}.flash.show{opacity:.97}
